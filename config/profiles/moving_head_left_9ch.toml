# Left moving head ([7x10W Mini Moving Head] at 66-74 in QLC+), as it really behaves.
#
# QLC+ treats both heads as the same 9-channel fixture, but this head does not
# follow that layout — it is probably set to a different DMX mode in its own menu.
# Checked live in QLC+ Simple Desk, Nov 2026: ch4 red, ch5 green, ch6 blue,
# ch8 dimmer, ch9 must be 255 for any light. White is mixed from red + green + blue.

name = "Moving head, left (9ch, dimmer on ch8)"
source = "live test in QLC+ Simple Desk"
footprint = 9

channels = [
  { offset = 1, attr = "pan",     lock = 0, note = "movement locked for now" },
  { offset = 2, attr = "tilt",    lock = 0, note = "movement locked for now" },
  { offset = 3, attr = "unknown", lock = 0, note = "not needed for light (probably pan/tilt speed)" },
  { offset = 4, attr = "red",     display = [1.0, 0.0, 0.0] },
  { offset = 5, attr = "green",   display = [0.0, 1.0, 0.0] },
  { offset = 6, attr = "blue",    display = [0.0, 0.0, 1.0] },
  { offset = 7, attr = "macro",   lock = 0, note = "white or colour presets — unclear; white is mixed from RGB" },
  { offset = 8, attr = "dimmer" },
  { offset = 9, attr = "shutter", lock = 255, note = "must be 255 for light; lower values may strobe" },
]
