# Zones for `xrlight screen`: which part of the captured display (the picture sent
# to the LED wall) each fixture follows. rect = [x0, y0, x1, y1] as fractions 0..1
# of the display, y = 0 at the top. Left/right as seen from the brain bar desk,
# which faces the wall, so the left of the picture is the left of the stage.
# Fixtures without a zone keep their home look.
# Optional `gain` (0..2, default 1) multiplies a zone's brightness, on top of --gain.

[[zone]]
fixture = "Front Right"
rect = [0.667, 0.0, 1.0, 1.0]   # right third

[[zone]]
fixture = "Front Middle"
rect = [0.333, 0.0, 0.667, 1.0] # middle third

[[zone]]
fixture = "Front Left"
rect = [0.0, 0.0, 0.333, 1.0]   # left third

# The four white side pars read too bright next to the front pars. gain = 0.5 is
# the side-fill ratio; tune it live: edit the value, then restart `xrlight screen`.

[[zone]]
fixture = "Right back"
rect = [0.5, 0.0, 1.0, 1.0]     # right half
gain = 0.5                      # side-fill ratio

[[zone]]
fixture = "Right front"
rect = [0.5, 0.0, 1.0, 1.0]
gain = 0.5                      # side-fill ratio

[[zone]]
fixture = "Left front"
rect = [0.0, 0.0, 0.5, 1.0]     # left half
gain = 0.5                      # side-fill ratio

[[zone]]
fixture = "Left back"
rect = [0.0, 0.0, 0.5, 1.0]
gain = 0.5                      # side-fill ratio

[[zone]]
fixture = "Head left"
rect = [0.0, 0.0, 0.5, 0.5]     # top-left quarter

[[zone]]
fixture = "Head right"
rect = [0.5, 0.0, 1.0, 0.5]     # top-right quarter

[[zone]]
fixture = "Orbiter"
rect = [0.33, 0.2, 0.67, 0.8]   # centre

# Astera tubes: each pixel follows a horizontal slice of a screen edge, top slice =
# pixel 1 (verified: pixel 1 is the top end). Tube A stands at the left pole under Head
# left, so it follows the left edge; Tube B at the right pole under Head right follows
